<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente IA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0f;
      color: #e4e4e7;
      height: 100vh;
      display: flex;
    }
    .sidebar {
      width: 280px;
      background: #14141a;
      border-right: 1px solid #27272a;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }
    .sidebar h1 {
      font-size: 1.25rem;
      color: #ef4444;
      margin-bottom: 0.5rem;
    }
    .sidebar p {
      font-size: 0.8125rem;
      color: #71717a;
      margin-bottom: 2rem;
    }
    .sidebar .info {
      margin-top: auto;
      font-size: 0.75rem;
      color: #52525b;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #27272a;
      background: #14141a;
    }
    .chat-header h2 { font-size: 1rem; font-weight: 600; }
    .chat-header .status {
      font-size: 0.75rem;
      color: #22c55e;
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .chat-header .status::before {
      content: '';
      width: 6px; height: 6px;
      background: #22c55e;
      border-radius: 50%;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      line-height: 1.5;
      font-size: 0.9rem;
    }
    .message.user {
      align-self: flex-end;
      background: #ef4444;
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }
    .message.assistant {
      align-self: flex-start;
      background: #1c1c24;
      border: 1px solid #27272a;
      border-bottom-left-radius: 0.25rem;
    }
    .message.typing {
      align-self: flex-start;
      background: #1c1c24;
      border: 1px solid #27272a;
      display: flex;
      gap: 0.25rem;
      padding: 1rem 1.25rem;
    }
    .message.typing span {
      width: 8px; height: 8px;
      background: #71717a;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .message.typing span:nth-child(1) { animation-delay: -0.32s; }
    .message.typing span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid #27272a;
      display: flex;
      gap: 0.75rem;
    }
    .input-area input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #27272a;
      border-radius: 0.75rem;
      background: #14141a;
      color: #e4e4e7;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus { border-color: #ef4444; }
    .input-area input::placeholder { color: #52525b; }
    .input-area button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.75rem;
      background: #ef4444;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .input-area button:hover { background: #dc2626; }
    .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h1>Assistente IA</h1>
    <p>Chatbot inteligente com NLP, integração com APIs externas e suporte a múltiplos canais.</p>
    <div class="info">
      Python · FastAPI · OpenAI · WebSocket<br>
      <a href="https://github.com/devkroz/assistente-ia" style="color:#ef4444;text-decoration:none;">GitHub</a>
    </div>
  </div>
  <div class="main">
    <div class="chat-header">
      <h2>Chat</h2>
      <div class="status">Online</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input type="text" id="input" placeholder="Digite sua mensagem..." autofocus />
      <button id="send">Enviar</button>
    </div>
  </div>
  <script>
    const ws = new WebSocket(`wss://${location.host}/ws`);
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      removeTyping();
      if (data.type === 'response') {
        addMessage(data.content, 'assistant');
      }
    };

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message typing';
      div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, 'user');
      ws.send(JSON.stringify({ message: text }));
      showTyping();
      inputEl.value = '';
      sendBtn.disabled = true;
    }

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    sendBtn.addEventListener('click', sendMessage);

    ws.onopen = () => { sendBtn.disabled = false; };
    ws.onclose = () => { sendBtn.disabled = true; };
  </script>
</body>
</html>
